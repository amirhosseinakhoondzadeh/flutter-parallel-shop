name: check
on:
  pull_request:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
